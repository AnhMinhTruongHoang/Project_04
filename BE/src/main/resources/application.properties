# ===============================
# APPLICATION
# ===============================
spring.application.name=DemoSession2_WebAPI_C2310L

server.port=${PORT:8000}


# ===============================
# DATABASE - TIDB CLOUD
# ===============================
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false


# ===============================
# LEGACY LOCAL MEDIA
# ===============================
images_url=${IMAGES_URL:http://localhost:8000/uploads/images/}
audio_url=${AUDIO_URL:http://localhost:8000/uploads/audio/}


# ===============================
# MULTIPART
# ===============================
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB


# ===============================
# MAIL
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8


# ===============================
# CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


# ===============================
# FRONTEND
# ===============================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ===============================
# LEGACY MEDIA MIGRATION
# ===============================
legacy.media.migration-enabled=${LEGACY_MEDIA_MIGRATION_ENABLED:true}


# ===============================
# VNPAY SANDBOX
# ===============================
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}

vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8000/api/v1/payments/vnpay/return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8000/api/v1/payments/vnpay/ipn}

vnpay.expire-minutes=${VNPAY_EXPIRE_MINUTES:15}


# ===============================
# PAYMENT MAINTENANCE
# ===============================
payment.maintenance.expire-delay-ms=${PAYMENT_EXPIRE_DELAY_MS:60000}

# ===============================
# APPLICATION TIMEZONE
# ===============================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ===============================
# DEVTOOLS
# ===============================
spring.devtools.restart.enabled=false

# ===============================
# ARTIST EARNINGS
# ===============================
artist.earning.amount-per-qualified-stream=${ARTIST_EARNING_AMOUNT_PER_STREAM:20}


# =============================== # change 0 for testing normal is 7
artist.earning.hold-days=${ARTIST_EARNING_HOLD_DAYS:7}
# ===============================

# ===============================
# ARTIST EARNING MAINTENANCE
# ===============================

# =============================== change to 10000 for testing normal is 60000
artist.earning.release-delay-ms=${ARTIST_EARNING_RELEASE_DELAY_MS:60000}
# ===============================

# ===============================
# ARTIST PAYOUT
# ===============================

# =============================== /// 20 for testing normal is 100000
artist.payout.minimum-amount=${ARTIST_PAYOUT_MINIMUM_AMOUNT:100000}
# ===============================
artist.payout.maximum-amount=${ARTIST_PAYOUT_MAXIMUM_AMOUNT:100000000}

# =============================== /// expiring warning
subscription.maintenance.expiring-warning-days=${SUBSCRIPTION_EXPIRING_WARNING_DAYS:3}
subscription.maintenance.expiring-delay-ms=${SUBSCRIPTION_EXPIRING_DELAY_MS:3600000}

# Kiểm tra tỷ giá được lên lịch mỗi 60 giây
artist.earning.rate-scheduler-delay-ms=60000

# =====================================================
# COPYRIGHT - CHROMAPRINT LOCAL
# =====================================================

# Dùng dấu / trên Windows để tránh lỗi escape đường dẫn

copyright.chromaprint.fpcalc-path=${FPCALC_PATH:./tools/chromaprint/windows/fpcalc.exe}

# Thời gian tối đa cho một lần quét audio

copyright.chromaprint.timeout-seconds=${FPCALC_TIMEOUT_SECONDS:180}

# Giới hạn audio tải về để quét: 100 MB

copyright.chromaprint.max-download-bytes=${FPCALC_MAX_DOWNLOAD_BYTES:104857600}

# ===============================
# DEFAULT LICENSE FOR SEED TRACKS
# ===============================
seed.default-license-url=${SEED_DEFAULT_LICENSE_URL:}

# ===============================
# ARTIST MEMBERSHIP
# ===============================

# Phí SoundClone giữ lại từ mỗi khoản thanh toán hội viên.
membership.platform-fee-percent=${MEMBERSHIP_PLATFORM_FEE_PERCENT:10}

# Số ngày giữ doanh thu trước khi artist được phép rút.
membership.revenue-hold-days=${MEMBERSHIP_REVENUE_HOLD_DAYS:7}

# Một chu kỳ membership MVP có thời hạn 30 ngày.
membership.period-days=${MEMBERSHIP_PERIOD_DAYS:30}

# Giá gói hội viên tối thiểu.
membership.minimum-plan-price=${MEMBERSHIP_MINIMUM_PLAN_PRICE:10000}

# Giá gói hội viên tối đa.
membership.maximum-plan-price=${MEMBERSHIP_MAXIMUM_PLAN_PRICE:10000000}

# MEMBERSHIP REVENUE RELEASE
membership.revenue-release.initial-delay-ms=${MEMBERSHIP_REVENUE_RELEASE_INITIAL_DELAY_MS:30000}
membership.revenue-release.fixed-delay-ms=${MEMBERSHIP_REVENUE_RELEASE_FIXED_DELAY_MS:60000}

# MEMBERSHIP EXPIRATION
membership.expiration.initial-delay-ms=${MEMBERSHIP_EXPIRATION_INITIAL_DELAY_MS:45000}
membership.expiration.fixed-delay-ms=${MEMBERSHIP_EXPIRATION_FIXED_DELAY_MS:60000}