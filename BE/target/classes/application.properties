# ===============================
# APPLICATION
# ===============================
spring.application.name=DemoSession2_WebAPI_C2310L

server.port=${PORT:8000}


# ===============================
# DATABASE - TIDB CLOUD
# ===============================
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false


# ===============================
# LEGACY LOCAL MEDIA
# ===============================
images_url=${IMAGES_URL:http://localhost:8000/uploads/images/}
audio_url=${AUDIO_URL:http://localhost:8000/uploads/audio/}


# ===============================
# MULTIPART
# ===============================
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB


# ===============================
# MAIL
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8


# ===============================
# CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


# ===============================
# FRONTEND
# ===============================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ===============================
# LEGACY MEDIA MIGRATION
# ===============================
legacy.media.migration-enabled=${LEGACY_MEDIA_MIGRATION_ENABLED:true}